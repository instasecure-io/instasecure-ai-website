<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AWS Organizational Policy Controls — SCP & RCP</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; color: #1a1a2e; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; padding: 24px; }
  h1 { text-align: center; font-size: 1.5rem; margin-bottom: 4px; color: #1a1a2e; }
  .subtitle { text-align: center; font-size: 0.9rem; color: #6b7280; margin-bottom: 20px; }
  .controls { text-align: center; margin-bottom: 16px; display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; }
  .controls button {
    background: #fff; color: #1a1a2e; border: 2px solid #e5e7eb;
    padding: 10px 22px; border-radius: 8px; cursor: pointer;
    font-size: 13px; font-weight: 600; font-family: inherit; transition: all 0.15s;
  }
  .controls button:hover { border-color: #2563eb; color: #2563eb; }
  .controls button.active { background: #2563eb; border-color: #2563eb; color: #fff; }
  .step-hint {
    font-size: 12px; color: #6b7280; padding: 6px 14px;
    border: 1px solid #e5e7eb; border-radius: 6px; background: #f9fafb;
    min-width: 280px; text-align: center; transition: all 0.3s;
  }
  .step-hint.highlight { border-color: #2563eb; color: #2563eb; background: #eff6ff; }
  svg { display: block; margin: 0 auto; }
  .label { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
  .packet, .packet-trail { opacity: 0; }
  .firewall-flash, .block-x, .block-label, .eval-text { opacity: 0; }
  .flow-line { opacity: 0.1; }
  .scene-hidden { opacity: 0; pointer-events: none; transition: opacity 0.5s; }
  .scene-visible { opacity: 1; pointer-events: auto; transition: opacity 0.5s; }
  .traffic-hidden { opacity: 0; transition: opacity 0.6s; }
  .traffic-visible { opacity: 1; transition: opacity 0.6s; }
  .policy-step { opacity: 0; }
  .eff-layer { opacity: 0; }
</style>
</head>
<body>
<h1>AWS Organization Policy Controls</h1>
<p class="subtitle">Service Control Policies (SCP) & Resource Control Policies (RCP) act as organizational firewalls</p>

<div class="controls">

<script>
const $=id=>document.getElementById(id);
let currentDemo=null, currentStep=0, running=false;

function setHint(t,h=false){const e=$('step-hint');e.textContent=t;e.className=h?'step-hint highlight':'step-hint';e.style.opacity=t?1:0;}

function anim(el,props,dur,delay=0){
  return new Promise(resolve=>{setTimeout(()=>{
    const t0=performance.now(),init={};
    for(const k in props) init[k]=k==='opacity'?(parseFloat(el.style.opacity||getComputedStyle(el).opacity)||0):(parseFloat(el.getAttribute(k))||0);
    (function tick(now){
      const t=Math.min((now-t0)/dur,1),e=t<0.5?2*t*t:-1+(4-2*t)*t;
      for(const k in props){const v=init[k]+(props[k]-init[k])*e;k==='opacity'?el.style.opacity=v:el.setAttribute(k,v);}
      t<1?requestAnimationFrame(tick):resolve();
    })(performance.now());
  },delay);});
}

function flash(el,dur=400){return anim(el,{opacity:1},dur*0.3).then(()=>anim(el,{opacity:0},dur*0.7));}
function pulse(el,n=2){const o=el.getAttribute('stroke-width')||'1';let p=Promise.resolve();for(let i=0;i<n;i++) p=p.then(()=>{el.setAttribute('stroke-width','4');return new Promise(r=>setTimeout(r,150));}).then(()=>{el.setAttribute('stroke-width',o);return new Promise(r=>setTimeout(r,150));});return p;}
function movePkt(pid,tid,x0,x1,dur){const p=$(pid),t=$(tid);p.style.opacity=1;t.style.opacity=0.6;p.setAttribute('cx',x0);t.setAttribute('cx',x0);const t0=performance.now();return new Promise(resolve=>{(function tick(now){const f=Math.min((now-t0)/dur,1),x=x0+(x1-x0)*(f<0.5?2*f*f:-1+(4-2*f)*f);p.setAttribute('cx',x);t.setAttribute('cx',x-14);f<1?requestAnimationFrame(tick):(t.style.opacity=0,resolve());})(performance.now());});}
function movePktV(pid,tid,y0,y1,dur){const p=$(pid),t=$(tid);p.style.opacity=1;t.style.opacity=0.6;p.setAttribute('cy',y0);t.setAttribute('cy',y0);const t0=performance.now();return new Promise(resolve=>{(function tick(now){const f=Math.min((now-t0)/dur,1),y=y0+(y1-y0)*(f<0.5?2*f*f:-1+(4-2*f)*f);p.setAttribute('cy',y);t.setAttribute('cy',y-10);f<1?requestAnimationFrame(tick):(t.style.opacity=0,resolve());})(performance.now());});}
function ripple(id,dur=400){const e=$(id);e.style.opacity=0.7;return anim(e,{r:20},dur).then(()=>anim(e,{opacity:0},200));}

function resetScene(pfx,pktIds,trailIds,startX){
  pktIds.forEach(id=>{$(id).style.opacity=0;$(id).setAttribute('cx',startX);});
  trailIds.forEach(id=>{$(id).style.opacity=0;$(id).setAttribute('cx',startX);});
  document.querySelectorAll(`#${pfx}-scene .block-x,#${pfx}-scene .block-label,#${pfx}-scene .firewall-flash,#${pfx}-scene .eval-text`).forEach(e=>e.style.opacity=0);
  document.querySelectorAll(`#${pfx}-scene .flow-line`).forEach(e=>e.style.opacity=0.1);
  document.querySelectorAll(`#${pfx}-scene circle.firewall-flash`).forEach(e=>{e.setAttribute('r',0);e.style.opacity=0;});
  if($(pfx+'-traffic')) $(pfx+'-traffic').setAttribute('class','traffic-hidden');
  if($(pfx+'-legend')) $(pfx+'-legend').style.opacity=0;
  ['a','b','c','d','e','f','g'].forEach(s=>{const el=$(`${pfx}-s1${s}`);if(el)el.style.opacity=0;});
}
function resetEff(){
  document.querySelectorAll('#eff-scene .eff-layer').forEach(e=>e.style.opacity=0);
  $('eff-pkt').style.opacity=0;$('eff-pkt').setAttribute('cy',50);
  $('eff-trail').style.opacity=0;$('eff-trail').setAttribute('cy',50);
  for(let i=1;i<=5;i++) $('eff-ck'+i).style.opacity=0;
}
function resetAll(){
  running=false;currentDemo=null;currentStep=0;
  ['scp','rcp','eff','dp'].forEach(s=>$(s+'-scene').setAttribute('class','scene-hidden'));
  resetScene('scp',['scp-pg1','scp-pr1','scp-pg2','scp-pg3'],['scp-tg1','scp-tr1','scp-tg2','scp-tg3'],175);
  resetScene('rcp',['rcp-pg1','rcp-pr1','rcp-pg2','rcp-pr2'],['rcp-tg1','rcp-tr1','rcp-tg2','rcp-tr2'],175);
  resetEff();
  resetDp();
  document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('active'));
  setHint('');
}

async function handleClick(type){
  if(running) return;
  if(currentDemo && currentDemo!==type){resetAll();await new Promise(r=>setTimeout(r,100));}
  if(type==='eff'){
    if(currentDemo==='eff') return;
    currentDemo='eff';currentStep=2;
    $('btn-eff').classList.add('active');
    $('eff-scene').setAttribute('class','scene-visible');
    running=true;await animateEff();running=false;
    return;
  }
  if(type==='dp'){
    if(currentDemo==='dp') return;
    currentDemo='dp';currentStep=2;
    $('btn-dp').classList.add('active');
    $('dp-scene').setAttribute('class','scene-visible');
    running=true;await animateDp();running=false;
    return;
  }
  if(currentStep===0){
    currentDemo=type;currentStep=1;
    $(`btn-${type}`).classList.add('active');
    $(`${type}-scene`).setAttribute('class','scene-visible');
    running=true;await animatePolicy(type);running=false;
    setHint(`Click "${type.toUpperCase()} Demo" again for Step 2: Traffic Flow`,true);
  } else if(currentStep===1 && currentDemo===type){
    currentStep=2;running=true;
    $(`${type}-traffic`).setAttribute('class','traffic-visible');
    if($(type+'-legend')) $(type+'-legend').style.opacity=1;
    await new Promise(r=>setTimeout(r,600));
    setHint('Step 2: Simulating traffic flow...');
    if(type==='scp') await runSCPTraffic(); else await runRCPTraffic();
    setHint('Done! Click Reset or try another demo.');
    running=false;
  }
}

async function animatePolicy(type){
  const steps=['a','b','c','d','e','f','g'];
  const hints={
    scp:['SCP policy created: Deny ec2 outside VPC, deny sts from unknown IPs','','Attached to AWS Organization...','','Cascades to OU — Production...','','Enforced as firewall on every account in OU'],
    rcp:['RCP policy created: Deny S3 without PrincipalOrgID','','Attached to AWS Organization...','','Cascades to OU — Production...','','Enforced as firewall on every resource in OU']
  };
  for(let i=0;i<steps.length;i++){
    const el=$(`${type}-s1${steps[i]}`);if(!el)continue;
    if(hints[type][i])setHint(hints[type][i]);
    await anim(el,{opacity:1},500);
    if(steps[i]==='a'){await pulse($(`${type}-policy-box`),2);await new Promise(r=>setTimeout(r,400));}
    else if(steps[i]==='c') await new Promise(r=>setTimeout(r,600));
    else if(steps[i]==='e') await new Promise(r=>setTimeout(r,400));
    else if(steps[i]==='g') await pulse($(`${type}-wall`),3);
    else await new Promise(r=>setTimeout(r,200));
  }
}

async function animateEff(){
  setHint('A request must pass through every policy layer...');
  const layers=[
    {id:'eff-rcp', label:'eff-L1', hint:'Layer 1: RCP — Org-wide resource guardrail (applies to all resources in OU)'},
    {id:'eff-a1'},
    {id:'eff-scp', label:'eff-L2', hint:'Layer 2: SCP — Org-wide identity guardrail (applies to all identities in OU)'},
    {id:'eff-a2'},
    {id:'eff-rp', label:'eff-L3', hint:'Layer 3: Resource Policy — who can access this specific S3 bucket, KMS key, etc.'},
    {id:'eff-a3'},
    {id:'eff-pb', label:'eff-L4', hint:'Layer 4: Permissions Boundary — caps this specific identity\'s maximum permissions'},
    {id:'eff-a4'},
    {id:'eff-idp', label:'eff-L5', hint:'Layer 5: Identity Policy — what this user/role is actually allowed to do'},
  ];
  for(const l of layers){
    if(l.hint) setHint(l.hint);
    await anim($(l.id),{opacity:1},400);
    if(l.label) await anim($(l.label),{opacity:1},300);
    if(l.hint) await new Promise(r=>setTimeout(r,800));
    else await new Promise(r=>setTimeout(r,200));
  }
  await anim($('eff-bracket'),{opacity:1},500);
  await new Promise(r=>setTimeout(r,500));

  setHint('Request: ec2:RunInstances — must pass every layer...');
  const pkt=$('eff-pkt'), trail=$('eff-trail');
  pkt.style.opacity=1; trail.style.opacity=0.6;

  await movePktV('eff-pkt','eff-trail',50,110,600);
  setHint('RCP: Is the resource access within the org? YES');
  await anim($('eff-ck1'),{opacity:1},300);await new Promise(r=>setTimeout(r,600));

  await movePktV('eff-pkt','eff-trail',110,208,500);
  setHint('SCP: Is ec2:RunInstances allowed from this VPC? YES');
  await anim($('eff-ck2'),{opacity:1},300);await new Promise(r=>setTimeout(r,600));

  await movePktV('eff-pkt','eff-trail',208,300,500);
  setHint('Resource Policy: Does the resource allow this principal? YES');
  await anim($('eff-ck3'),{opacity:1},300);await new Promise(r=>setTimeout(r,600));

  await movePktV('eff-pkt','eff-trail',300,390,500);
  setHint('Permissions Boundary: Is ec2:RunInstances within the cap? YES');
  await anim($('eff-ck4'),{opacity:1},300);await new Promise(r=>setTimeout(r,600));

  await movePktV('eff-pkt','eff-trail',390,480,500);
  setHint('Identity Policy: Does the IAM policy allow ec2:RunInstances? YES');
  await anim($('eff-ck5'),{opacity:1},300);await new Promise(r=>setTimeout(r,600));

  await movePktV('eff-pkt','eff-trail',480,548,400);
  await anim($('eff-result'),{opacity:1},500);
  pkt.setAttribute('fill','#16a34a');
  setHint('All 5 layers passed. Request ALLOWED. If any layer denied, request would be denied.');
  await new Promise(r=>setTimeout(r,500));
  await anim(pkt,{opacity:0},400);
}

function resetDp(){
  for(let i=1;i<=6;i++){
    $('dp-s'+i).style.opacity=0;
    $('dp-s'+i+'-pkt').style.opacity=0;
    $('dp-s'+i+'-trl').style.opacity=0;
    const s=dpPktStart[i];
    $('dp-s'+i+'-pkt').setAttribute('cx',s.cx);$('dp-s'+i+'-pkt').setAttribute('cy',s.cy);
    $('dp-s'+i+'-trl').setAttribute('cx',s.cx);$('dp-s'+i+'-trl').setAttribute('cy',s.cy);
    const line=$('dp-s'+i+'-line'); if(line) line.style.opacity=0;
    const ev=$('dp-s'+i+'-eval'); if(ev) ev.style.opacity=0;
    const bl=$('dp-s'+i+'-block'); if(bl) bl.style.opacity=0;
    const rs=$('dp-s'+i+'-result'); if(rs) rs.style.opacity=0;
  }

  dpScenarioRunning=false;
}

let dpScenarioRunning=false;

function movePktXY(pid,tid,x0,y0,x1,y1,dur){
  const p=$(pid),t=$(tid);
  p.style.opacity=1;t.style.opacity=0.6;
  p.setAttribute('cx',x0);p.setAttribute('cy',y0);
  t.setAttribute('cx',x0);t.setAttribute('cy',y0);
  const t0=performance.now();
  return new Promise(resolve=>{(function tick(now){
    const f=Math.min((now-t0)/dur,1),e=f<0.5?2*f*f:-1+(4-2*f)*f;
    const cx=x0+(x1-x0)*e,cy=y0+(y1-y0)*e;
    p.setAttribute('cx',cx);p.setAttribute('cy',cy);
    const tb=Math.max(0,e-0.1);
    t.setAttribute('cx',x0+(x1-x0)*tb);t.setAttribute('cy',y0+(y1-y0)*tb);
    f<1?requestAnimationFrame(tick):(t.style.opacity=0,resolve());
  })(performance.now());});
}

async function runDpScenario(n){
  if(dpScenarioRunning) return;
  if(currentDemo!=='dp') return;
  dpScenarioRunning=true;

  // Reset all scenarios
  for(let i=1;i<=6;i++){
    $('dp-s'+i).style.opacity=0;
    $('dp-s'+i+'-pkt').style.opacity=0;
    $('dp-s'+i+'-trl').style.opacity=0;
    const st=dpPktStart[i];
    $('dp-s'+i+'-pkt').setAttribute('cx',st.cx);$('dp-s'+i+'-pkt').setAttribute('cy',st.cy);
    $('dp-s'+i+'-trl').setAttribute('cx',st.cx);$('dp-s'+i+'-trl').setAttribute('cy',st.cy);
    ['line','eval','block','result'].forEach(k=>{const e=$('dp-s'+i+'-'+k);if(e)e.style.opacity=0;});
  }

  // Highlight card
  document.querySelectorAll('.dp-card-bg').forEach(e=>{e.setAttribute('stroke','#d1d5db');e.setAttribute('stroke-width','1.5');});
  const cardBg=document.querySelector('#dp-card'+n+' .dp-card-bg');
  cardBg.setAttribute('stroke',dpCardColors[n]);
  cardBg.setAttribute('stroke-width','2.5');

  const s='dp-s'+n, cfg=dpAnimCfg[n];
  await anim($(s),{opacity:1},400);
  await new Promise(r=>setTimeout(r,300));

  const line=$(s+'-line'); if(line) line.style.opacity=0.6;

  // Animate packet
  await movePktXY(s+'-pkt',s+'-trl', cfg.x0,cfg.y0, cfg.x1,cfg.y1, 1200);

  // Show eval
  await anim($(s+'-eval'),{opacity:1},400);
  await new Promise(r=>setTimeout(r,1500));

  // Block
  await anim($(s+'-block'),{opacity:1},300);
  await anim($(s+'-pkt'),{opacity:0},300);
  await new Promise(r=>setTimeout(r,400));

  // Result
  await anim($(s+'-result'),{opacity:1},500);

  dpScenarioRunning=false;
}
