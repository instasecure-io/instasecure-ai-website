<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 56 440 270" role="img" aria-labelledby="gates-title gates-desc" preserveAspectRatio="xMidYMid meet" style="display:block;font-family:Inter,ui-sans-serif,system-ui,sans-serif">
  <title id="gates-title">Gates — a section of wall</title>
  <desc id="gates-desc">A pipeline gate is a single wall segment. The attacker bypasses it and reaches AWS via a stolen credential.</desc>

  <defs>
    <symbol id="vb-block" viewBox="0 0 24 12" overflow="visible">
      <rect x="0.5" y="0.5" width="23" height="11" rx="1.5" fill="#eef1fc" stroke="#4d66e0" stroke-width="1"></rect>
    </symbol>
    <marker id="vb-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4d66e0"></path>
    </marker>
    <marker id="vb-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff5470"></path>
    </marker>
    <linearGradient id="vb-ground" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0e1230" stop-opacity="0.06"></stop>
      <stop offset="100%" stop-color="#0e1230" stop-opacity="0"></stop>
    </linearGradient>
    <radialGradient id="vb-impact" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5470" stop-opacity="0.55"></stop>
      <stop offset="60%" stop-color="#ff5470" stop-opacity="0.12"></stop>
      <stop offset="100%" stop-color="#ff5470" stop-opacity="0"></stop>
    </radialGradient>
</defs>

  
  <line x1="50" y1="298" x2="470" y2="298" stroke="#e5e7f0" stroke-width="1"></line>

  <g id="gates">
    
    <line x1="60" y1="232" x2="450" y2="232" stroke="#c9d2f3" stroke-width="1.5" stroke-dasharray="2 4"></line>
    
    <g>
      <rect x="60" y="218" width="64" height="28" rx="5" fill="#f5f7fd" stroke="#c9d2f3" stroke-width="1"></rect>
      <circle cx="70" cy="232" r="2.2" fill="#4d66e0"></circle>
      <text x="92" y="236" text-anchor="middle" font-family="ui-monospace, &#39;JetBrains Mono&#39;, monospace" font-size="9.5" fill="#0e1230">PR #1242</text>
    </g>
    <g>
      <rect x="138" y="218" width="64" height="28" rx="5" fill="#f5f7fd" stroke="#c9d2f3" stroke-width="1"></rect>
      <circle cx="148" cy="232" r="2.2" fill="#4d66e0"></circle>
      <text x="170" y="236" text-anchor="middle" font-family="ui-monospace, &#39;JetBrains Mono&#39;, monospace" font-size="9.5" fill="#0e1230">PR #1243</text>
    </g>
    <g>
      <rect x="216" y="218" width="64" height="28" rx="5" fill="#f5f7fd" stroke="#c9d2f3" stroke-width="1"></rect>
      <circle cx="226" cy="232" r="2.2" fill="#4d66e0"></circle>
      <text x="248" y="236" text-anchor="middle" font-family="ui-monospace, &#39;JetBrains Mono&#39;, monospace" font-size="9.5" fill="#0e1230">PR #1244</text>
    </g>

    
    <line x1="280" y1="232" x2="306" y2="232" stroke="#7d92ec" stroke-width="1.5" marker-end="url(#vb-arrow-blue)"></line>

    
    <g id="gate-wall">
      <ellipse cx="334" cy="296" rx="36" ry="3.5" fill="url(#vb-ground)"></ellipse>
      
      <use href="#vb-block" x="306" y="158" width="24" height="12"></use>
      <use href="#vb-block" x="330" y="158" width="24" height="12"></use>
      <use href="#vb-block" x="354" y="158" width="24" height="12"></use>
      <use href="#vb-block" x="318" y="176" width="24" height="12"></use>
      <use href="#vb-block" x="342" y="176" width="24" height="12"></use>
      <use href="#vb-block" x="366" y="176" width="24" height="12"></use>
      <use href="#vb-block" x="306" y="194" width="24" height="12"></use>
      <use href="#vb-block" x="330" y="194" width="24" height="12"></use>
      <use href="#vb-block" x="354" y="194" width="24" height="12"></use>
      <use href="#vb-block" x="318" y="212" width="24" height="12"></use>
      <use href="#vb-block" x="342" y="212" width="24" height="12"></use>
      <use href="#vb-block" x="366" y="212" width="24" height="12"></use>
      <use href="#vb-block" x="306" y="230" width="24" height="12"></use>
      <use href="#vb-block" x="330" y="230" width="24" height="12"></use>
      <use href="#vb-block" x="354" y="230" width="24" height="12"></use>
      <use href="#vb-block" x="318" y="248" width="24" height="12"></use>
      <use href="#vb-block" x="342" y="248" width="24" height="12"></use>
      <use href="#vb-block" x="366" y="248" width="24" height="12"></use>
      <use href="#vb-block" x="306" y="266" width="24" height="12"></use>
      <use href="#vb-block" x="330" y="266" width="24" height="12"></use>
      <use href="#vb-block" x="354" y="266" width="24" height="12"></use>
      
      <rect x="320" y="226" width="32" height="12" fill="#ffffff"></rect>
      <line x1="320" y1="226" x2="352" y2="226" stroke="#4d66e0" stroke-width="1.2"></line>
    </g>

    
    <line x1="370" y1="232" x2="396" y2="232" stroke="#7d92ec" stroke-width="1.5" marker-end="url(#vb-arrow-blue)"></line>

    
    <g>
      <rect x="396" y="208" width="68" height="48" rx="6" fill="#ffffff" stroke="#0e1230" stroke-width="1.4"></rect>
      <g transform="translate(410 215)" fill="none" stroke="#0e1230" stroke-width="1.2" stroke-linejoin="round">
        <path d="M16 2 L28 8 L28 22 L16 28 L4 22 L4 8 Z"></path>
        <path d="M16 2 V16 M4 8 L16 16 L28 8"></path>
      </g>
      <text x="430" y="270" text-anchor="middle" font-size="9" font-family="ui-monospace, &#39;JetBrains Mono&#39;, monospace" fill="#0e1230" letter-spacing="0.8">AWS · prod</text>
    </g>

    
    <g transform="translate(60 92)">
      <circle cx="14" cy="14" r="14" fill="#fff0f3" stroke="#ff5470" stroke-width="1.4"></circle>
      <path d="M14 6 L22 20 L6 20 Z" fill="#ff5470"></path>
      <rect x="13.2" y="11" width="1.6" height="6" rx="0.8" fill="#ffffff"></rect>
      <circle cx="14" cy="18.4" r="0.9" fill="#ffffff"></circle>
    </g>
    <text x="60" y="142" font-size="11" fill="#0e1230" font-weight="600">Attacker</text>
    <text x="60" y="156" font-size="9.5" fill="#4a4f6e" font-family="ui-monospace, &#39;JetBrains Mono&#39;, monospace">stolen credential</text>

    
    <path d="M 88 124 C 200 60, 360 60, 432 200" fill="none" stroke="#ff5470" stroke-width="2.4" stroke-linecap="round" marker-end="url(#vb-arrow-red)"></path>
    <g>
      <rect x="200" y="64" width="160" height="22" rx="11" fill="#fff0f3" stroke="#ffd1d9" stroke-width="1"></rect>
      <text x="280" y="79" text-anchor="middle" font-size="11" fill="#c43253" font-style="italic">walks around the wall</text>
    </g>

    
    <text x="334" y="316" text-anchor="middle" font-size="10.5" fill="#8a8fa8" font-style="italic">no top, no sides</text>

    
    <g transform="translate(274 282)">
      <rect x="0" y="0" width="120" height="20" rx="10" fill="#4d66e0"></rect>
      <text x="60" y="13.5" text-anchor="middle" font-size="10" font-family="ui-monospace, &#39;JetBrains Mono&#39;, monospace" fill="#ffffff" letter-spacing="1.6">PR · BUILD GATE</text>
    </g>
  </g>
</svg>